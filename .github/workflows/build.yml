# Runs the build and every test on each pull request and on pushes to main, so a
# PR shows a green check or a red cross before anyone merges it. The tests start
# their own Postgres with Testcontainers; GitHub's Ubuntu runners have Docker.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Gradle toolchain in build.gradle.kts asks for JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's downloads between runs.
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build
