# Local development only. These match docker-compose.yaml and are not real secrets.
spring.datasource.password=secretpassword
app.jwt.secret=dev-only-jwt-secret-change-me-in-every-real-env
app.payments.webhook-secret=dev-only-webhook-secret

# Also load the dev seed data (users, venues, bookings) from db/dev.
spring.flyway.locations=classpath:db/migration,classpath:db/dev
