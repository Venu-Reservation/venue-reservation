spring.application.name=reservation

# Local development uses the dev profile unless another one is set
# (e.g. SPRING_PROFILES_ACTIVE=prod). Its values are in application-dev.properties.
spring.profiles.default=dev

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Loads venue images for a page of venues in batches instead of one query each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Auth tokens (HS256). The secret must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=7d

# Shared secret for verifying payment webhook signatures.
app.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET}
