services:
  postgres:
    image: postgres:17
    container_name: reserved-postgres
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    # Data lives in memory, so every container start is an empty database:
    # the app's next start runs the migrations and the dev seed, with booking
    # dates relative to that day. Stopping the container deletes the data.
    tmpfs:
      - /var/lib/postgresql/data
